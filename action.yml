name: Release Note
description: Generate a release note for your project
author: purpleclay
branding:
  icon: file-text
  color: purple

inputs:
  working-directory:
    description: Directory containing the git repository to generate a release note for
    required: false
    default: ${{ github.workspace }}
  version:
    description: >-
      Version of release-note to download. Defaults to the version this action release was tested against.
    required: false
    default: ""
  token:
    description: >-
      GitHub token for API requests (release download, contributor
      attribution and avatars, and publishing the release)
    required: false
    default: ${{ github.token }}
  verify-attestation:
    description: >-
      Verify the downloaded release-note checksum and attestation before
      execution. Requires release-note >= 0.10.1.
    required: false
    default: "true"
  output:
    description: >-
      Path the generated release note is written to. Defaults to a file under
      the runner's temp directory — outside the workspace, so the working
      tree stays clean (GoReleaser --clean, git status gates) and no later
      step can accidentally commit it.
    required: false
    default: ""
  publish:
    description: >-
      Publish the generated release note as a GitHub release for the current
      tag. Requires a tag ref and `contents: write`. An existing release for
      the tag is left untouched.
    required: false
    default: "false"
  title:
    description: Title of the published release. Defaults to the tag name.
    required: false
    default: ""

outputs:
  release-note-path:
    description: Path to the generated release note
    value: ${{ steps.generate.outputs.notes-file }}
  release-note-version:
    description: The release-note version that was executed
    value: ${{ steps.download.outputs.version }}
  release-url:
    description: URL of the published release. Empty when `publish` is false.
    value: ${{ steps.publish.outputs.url }}

runs:
  using: composite
  steps:
    - name: validate_publish
      if: inputs.publish == 'true'
      shell: bash
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        # Checked before the download so a misconfigured trigger fails fast.
        if [ "${REF_TYPE}" != "tag" ]; then
          echo "::error::publish requires a tag ref (got ref_type='${REF_TYPE}', ref_name='${REF_NAME}')"
          exit 1
        fi

    - name: download_release_note
      id: download
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
        VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # The known-good CLI version for this action release. Bumped (and
        # re-tested) as part of cutting a new action version, so consumers
        # pinning the action get a tested pairing by default.
        #
        # renovate: datasource=github-releases depName=purpleclay/release-note
        DEFAULT_VERSION="0.12.0"
        version="${REQUESTED_VERSION:-$DEFAULT_VERSION}"

        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)   target="x86_64-unknown-linux-musl" ;;
          Linux/aarch64)  target="aarch64-unknown-linux-musl" ;;
          Darwin/x86_64)  target="x86_64-apple-darwin" ;;
          Darwin/arm64)   target="aarch64-apple-darwin" ;;
          *) echo "::error::unsupported runner platform: $(uname -s)/$(uname -m)"; exit 1 ;;
        esac

        archive="release-note-${version}-${target}.tar.gz"
        workdir="${RUNNER_TEMP}/release-note"
        mkdir -p "${workdir}" && cd "${workdir}"

        if [ "${VERIFY_ATTESTATION}" = "true" ]; then
          # checksums.txt and attestations were only introduced in 0.10.1 —
          # pinning an older version with verification left enabled fails
          # closed here, rather than silently skipping the check.
          #
          # --clobber lets the action run more than once in a job; whatever is
          # overwritten is re-verified below.
          gh release download "${version}" \
            --repo purpleclay/release-note \
            --pattern "${archive}" \
            --pattern "checksums.txt" \
            --clobber
          echo "::notice::downloaded ${archive}"

          # macOS has no sha256sum; shasum -a 256 is the portable equivalent.
          # Only the archive's own line is extracted, so neither tool needs
          # to tolerate the other three platform entries being absent.
          checksum_bin="sha256sum"
          [ "$(uname -s)" = "Darwin" ] && checksum_bin="shasum -a 256"
          grep "  ${archive}\$" checksums.txt | ${checksum_bin} --check
          echo "::notice::checksum verified for ${archive}"

          attestation_json="$(gh attestation verify "${archive}" \
            --repo purpleclay/release-note \
            --signer-workflow purpleclay/release-workflows/.github/workflows/release-rust.yml \
            --format json)"

          # Every entry (not just the first) is searched for a subject
          # matching the archive, since gh attestation verify can return more
          # than one result. jq -e requires exactly one match with a
          # non-empty digest and signer, and fails the step (via set -e) on
          # zero matches, ambiguous matches, or incomplete metadata — rather
          # than emitting a misleading success notice.
          attestation_match="$(printf '%s' "${attestation_json}" | jq -e -r --arg name "${archive}" '
            [ .[] as $entry
              | ($entry.verificationResult.statement.subject[]? | select(.name == $name)) as $subject
              | {digest: $subject.digest.sha256, signer: $entry.verificationResult.signature.certificate.buildSignerURI}
            ]
            | if (length == 1) and (.[0].digest | length > 0) and (.[0].signer | length > 0)
              then "\(.[0].digest)\t\(.[0].signer)"
              else null
              end
          ')"
          IFS=$'\t' read -r digest signer <<< "${attestation_match}"
          echo "::notice::attestation verified for ${archive} (sha256:${digest}, signed by ${signer})"
        else
          gh release download "${version}" \
            --repo purpleclay/release-note \
            --pattern "${archive}" \
            --clobber
          echo "::notice::downloaded ${archive}"
        fi

        tar -xzf "${archive}"
        chmod +x release-note
        echo "bin=${workdir}/release-note" >> "${GITHUB_OUTPUT}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"

    - name: generate_release_note
      id: generate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        BIN: ${{ steps.download.outputs.bin }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        # Default resolved here rather than in the input declaration: runner
        # context isn't reliably available in composite input defaults.
        OUTPUT="${OUTPUT:-${RUNNER_TEMP}/release-note/notes.md}"
        mkdir -p "$(dirname "${OUTPUT}")"
        # A relative output resolves against working-directory; later steps
        # (including publish_release) run elsewhere, so hand out an absolute path.
        OUTPUT="$(cd "$(dirname "${OUTPUT}")" && pwd)/$(basename "${OUTPUT}")"

        # release-note detects platform, repository, and tag from the CI environment.
        "${BIN}" > "${OUTPUT}"
        echo "notes-file=${OUTPUT}" >> "${GITHUB_OUTPUT}"

    - name: publish_release
      id: publish
      if: inputs.publish == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
        TITLE: ${{ inputs.title }}
        NOTES_FILE: ${{ steps.generate.outputs.notes-file }}
      run: |
        set -euo pipefail
        # Branch on the REST API's HTTP status rather than gh's "release not
        # found" wording, which isn't a stable interface. pipefail propagates
        # gh api's non-zero exit on a 404, so `|| true` keeps the script alive
        # for the case below.
        http_status="$(gh api -i "repos/${REPO}/releases/tags/${TAG}" 2>/dev/null | head -n1 | awk '{print $2}')" || true

        case "${http_status}" in
          200)
            # Never modified: with immutable releases there is no way back.
            echo "::notice::release for '${TAG}' already exists; nothing to publish"
            url="$(gh release view "${TAG}" --repo "${REPO}" --json url --jq '.url')"
            ;;
          404)
            url="$(gh release create "${TAG}" \
              --repo "${REPO}" \
              --title "${TITLE:-${TAG}}" \
              --notes-file "${NOTES_FILE}" \
              --verify-tag)"
            echo "::notice::published release ${url}"
            ;;
          *)
            echo "::error::could not confirm whether a release for '${TAG}' already exists (HTTP ${http_status:-unknown})"
            exit 1
            ;;
        esac
        echo "url=${url}" >> "${GITHUB_OUTPUT}"
