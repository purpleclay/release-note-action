# actionlint v1.7.12 predates the ubuntu-26.04 runners (rhysd/actionlint#682)
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm

# actionlint v1.7.12 predates GitHub's self-repository ($/) uses: syntax
paths:
  .github/workflows/*.yml:
    ignore:
      - 'specifying action "\$/" in invalid format'
