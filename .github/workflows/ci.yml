name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed by checkout to fetch the repository
      security-events: write # Needed by zizmor-action to publish scan results as code scanning alerts
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443

      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

      - name: zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          persona: pedantic

      - name: typos
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    steps:
      - name: harden_runner (ubuntu)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            35.164.209.184:443
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: harden_runner (macos)
        if: matrix.os == 'macos-latest'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.apple.com:443
            *.stepsecurity.io:443
            0.pool.ntp.org:443
            api.apple-cloudkit.com:443
            api.github.com:443
            apps.mzstatic.com:443
            calendars.icloud.com:443
            cp10.cloudflare.com:443
            gateway.icloud.com:443
            github.com:443
            mask-api.icloud.com:443
            mask.icloud.com:443
            mesu-cdn.origin-apple.com.akadns.net:443
            metrics.icloud.com:443
            ocsp.digicert.com:443
            ocsp2.g.aaplimg.com:443
            release-assets.githubusercontent.com:443
            s.mzstatic.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            updates.cdn-apple.com:443

      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: synthesise_release_history
        env:
          FIXTURE: ${{ runner.temp }}/fixture
        run: |
          set -euo pipefail
          mkdir -p "${FIXTURE}" && cd "${FIXTURE}"
          git init -q
          git config user.name "ci"
          git config user.email "ci@purpleclay.dev"
          git commit --allow-empty -m "feat: add synthetic feature for note generation"
          git commit --allow-empty -m "fix: resolve synthetic defect"
          git commit --allow-empty -m "docs: synthetic documentation change"
          git tag 0.1.0

      - name: run_action
        id: action
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/fixture

      - name: assert_output
        env:
          FIXTURE: ${{ runner.temp }}/fixture
          NOTES_FILE: ${{ steps.action.outputs.release-note-path }}
          VERSION: ${{ steps.action.outputs.release-note-version }}
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          test -s "${NOTES_FILE}" || { echo "::error::release note is missing or empty"; exit 1; }
          test -n "${VERSION}" || { echo "::error::version output not set"; exit 1; }
          # The default output location must not dirty the working tree
          # beyond the generated note itself — this is the contract that
          # keeps GoReleaser --clean (and any git cleanliness gate) happy
          # in consuming release jobs.
          test -z "$(git -C "${FIXTURE}" status --porcelain -- . ":(exclude)$(basename "${NOTES_FILE}")")" || { echo "::error::action dirtied the working tree"; git -C "${FIXTURE}" status --porcelain; exit 1; }
          {
            echo "### Generated release note (${VERSION}, ${OS})"
            echo
            cat "${NOTES_FILE}"
          } >> "${GITHUB_STEP_SUMMARY}"
